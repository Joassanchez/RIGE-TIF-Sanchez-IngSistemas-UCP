name: ci
on:
  push:
jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verificar
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace
      - run: bun test
      - run: bun run prueba:lenta
  referencia-nativa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i -g opencode-ai@1.18.25
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run referencias --raiz "$(npm root -g)"
      - name: Comprobar version instalada sin advertencias
        run: |
          bun -e '
            import { mkdirSync, mkdtempSync, realpathSync, rmSync } from "node:fs";
            import { tmpdir } from "node:os";
            import { basename, dirname, join } from "node:path";
            const raiz = realpathSync.native(tmpdir());
            const temporal = mkdtempSync(join(raiz, "rige-ci-version-"));
            try {
              const proyecto = join(temporal, "proyecto");
              mkdirSync(proyecto);
              const resultado = Bun.spawnSync([process.execPath, "run", "rige", "agentes", "--proyecto", proyecto], {
                env: { ...process.env, RIGE_ALMACEN: join(temporal, "almacen") }, stdout: "pipe", stderr: "pipe"
              });
              process.stdout.write(resultado.stdout);
              process.stderr.write(resultado.stderr);
              if (resultado.exitCode !== 0) throw new Error("La consulta de agentes no termino con codigo 0.");
              for (const linea of resultado.stderr.toString().split(/\r?\n/)) {
                let dato;
                try { dato = JSON.parse(linea); }
                catch (error) { if (error instanceof SyntaxError) continue; throw error; }
                if (dato !== null && typeof dato === "object" && Object.hasOwn(dato, "advertencia")) {
                  throw new Error("La instalacion real de OpenCode produjo una advertencia.");
                }
              }
            } finally {
              if (dirname(temporal) !== raiz || !basename(temporal).startsWith("rige-ci-version-")) throw new Error("Temporal fuera de la ubicacion esperada.");
              rmSync(temporal, { recursive: true, force: true });
            }
          '
